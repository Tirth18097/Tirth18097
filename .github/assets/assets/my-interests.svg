<svg width="1200" height="800" viewBox="0 0 1200 800"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <radialGradient id="space" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#101b45"/>
    <stop offset="45%" stop-color="#050b20"/>
    <stop offset="100%" stop-color="#01030b"/>
  </radialGradient>

  <!-- Planet gradients -->
  <radialGradient id="centerPlanet">
    <stop offset="0%" stop-color="#79d9ff"/>
    <stop offset="45%" stop-color="#465cff"/>
    <stop offset="100%" stop-color="#17145c"/>
  </radialGradient>

  <radialGradient id="dataPlanet">
    <stop offset="0%" stop-color="#fff4a3"/>
    <stop offset="50%" stop-color="#ffc928"/>
    <stop offset="100%" stop-color="#8b4d00"/>
  </radialGradient>

  <radialGradient id="mlPlanet">
    <stop offset="0%" stop-color="#ffd0ff"/>
    <stop offset="50%" stop-color="#ff52c8"/>
    <stop offset="100%" stop-color="#7b145e"/>
  </radialGradient>

  <radialGradient id="aiPlanet">
    <stop offset="0%" stop-color="#bafff2"/>
    <stop offset="50%" stop-color="#18e6b4"/>
    <stop offset="100%" stop-color="#075e61"/>
  </radialGradient>

  <radialGradient id="cvPlanet">
    <stop offset="0%" stop-color="#9ee9ff"/>
    <stop offset="50%" stop-color="#278cff"/>
    <stop offset="100%" stop-color="#14286d"/>
  </radialGradient>

  <radialGradient id="webPlanet">
    <stop offset="0%" stop-color="#ffc4b9"/>
    <stop offset="50%" stop-color="#ff6657"/>
    <stop offset="100%" stop-color="#711c36"/>
  </radialGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="smallGlow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Orbit paths -->
  <ellipse id="orbit1" cx="600" cy="400" rx="245" ry="125"/>
  <ellipse id="orbit2" cx="600" cy="400" rx="370" ry="190"/>
  <ellipse id="orbit3" cx="600" cy="400" rx="490" ry="250"/>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200" height="800" fill="url(#space)"/>


<!-- Stars -->

<g fill="#ffffff" opacity="0.8">

<circle cx="90" cy="90" r="2">
  <animate attributeName="opacity"
  values="0.2;1;0.2" dur="2s"
  repeatCount="indefinite"/>
</circle>

<circle cx="210" cy="170" r="1.5">
  <animate attributeName="opacity"
  values="1;0.2;1" dur="3s"
  repeatCount="indefinite"/>
</circle>

<circle cx="350" cy="80" r="2">
  <animate attributeName="opacity"
  values="0.3;1;0.3" dur="2.5s"
  repeatCount="indefinite"/>
</circle>

<circle cx="850" cy="80" r="2">
  <animate attributeName="opacity"
  values="1;0.2;1" dur="3s"
  repeatCount="indefinite"/>
</circle>

<circle cx="1060" cy="150" r="1.5">
  <animate attributeName="opacity"
  values="0.2;1;0.2" dur="2s"
  repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="500" r="2">
  <animate attributeName="opacity"
  values="1;0.3;1" dur="3s"
  repeatCount="indefinite"/>
</circle>

<circle cx="100" cy="560" r="2">
  <animate attributeName="opacity"
  values="0.2;1;0.2" dur="2.4s"
  repeatCount="indefinite"/>
</circle>

<circle cx="250" cy="700" r="1.5">
  <animate attributeName="opacity"
  values="1;0.2;1" dur="2.8s"
  repeatCount="indefinite"/>
</circle>

<circle cx="950" cy="700" r="2">
  <animate attributeName="opacity"
  values="0.2;1;0.2" dur="2.2s"
  repeatCount="indefinite"/>
</circle>

</g>


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<text x="600" y="55"
text-anchor="middle"
fill="#ffffff"
font-family="Arial, sans-serif"
font-size="34"
font-weight="700">

🚀 My Interests

</text>

<text x="600" y="88"
text-anchor="middle"
fill="#9db3d9"
font-family="Arial, sans-serif"
font-size="16">

Exploring ideas • Building solutions • Always learning

</text>


<!-- ================================================= -->
<!-- ORBITS -->
<!-- ================================================= -->

<g fill="none">

<ellipse cx="600" cy="400"
rx="245" ry="125"
stroke="#527dff"
stroke-width="1.5"
opacity="0.45"/>

<ellipse cx="600" cy="400"
rx="370" ry="190"
stroke="#7164ff"
stroke-width="1.5"
opacity="0.35"/>

<ellipse cx="600" cy="400"
rx="490" ry="250"
stroke="#35cfff"
stroke-width="1.5"
opacity="0.25"/>

</g>


<!-- ================================================= -->
<!-- CENTER PLANET -->
<!-- ================================================= -->

<g filter="url(#glow)">

<circle cx="600" cy="400"
r="105"
fill="url(#centerPlanet)"/>

<!-- atmosphere -->
<circle cx="600" cy="400"
r="112"
fill="none"
stroke="#65bfff"
stroke-width="3"
opacity="0.5">

<animate attributeName="r"
values="108;116;108"
dur="3s"
repeatCount="indefinite"/>

<animate attributeName="opacity"
values="0.3;0.7;0.3"
dur="3s"
repeatCount="indefinite"/>

</circle>

</g>


<!-- Center text -->

<text x="600" y="395"
text-anchor="middle"
fill="white"
font-family="Arial, sans-serif"
font-size="30"
font-weight="700">

TIRTH

</text>

<text x="600" y="425"
text-anchor="middle"
fill="#c7d8ff"
font-family="Arial, sans-serif"
font-size="15">

Learn • Build • Grow

</text>


