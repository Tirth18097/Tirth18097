<!-- ================================================= -->
<!-- ORBITING PARTICLES -->
<!-- ================================================= -->

<g fill="#ffffff" filter="url(#smallGlow)">

<circle cx="600" cy="275" r="5">
<animateTransform
attributeName="transform"
