</g>

</g>


<!-- AI label -->

<g>

<text x="600" y="115"
text-anchor="middle"
fill="#a9fff1"
font-family="Arial, sans-serif"
font-size="20"
font-weight="700">

Generative AI

</text>

<rect x="545" y="125"
width="110"
height="34"
rx="17"
