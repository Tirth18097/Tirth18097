<!-- DATA SCIENCE PLANET -->
<!-- ================================================= -->

<g>

<animateTransform
attributeName="transform"
type="rotate"
from="0 600 400"
to="360 600 400"
dur="16s"
repeatCount="indefinite"/>

<g transform="translate(355 400)">

<circle r="55"
fill="url(#dataPlanet)"
filter="url(#glow)"/>

<!-- Bar chart icon -->

<g fill="#ffffff">

<rect x="-20" y="5" width="10" height="20"/>
<rect x="-5" y="-8" width="10" height="33"/>
<rect x="10" y="-20" width="10" height="45"/>

</g>

</g>

</g>


<!-- Data label -->

<g>

<text x="250" y="270"
fill="#ffe58a"
font-family="Arial, sans-serif"
font-size="20"
font-weight="700">

Data Science &amp; Analytics

</text>

