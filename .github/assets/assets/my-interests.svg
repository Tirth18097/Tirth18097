filter="url(#glow)"/>

<!-- eye -->

<path d="M -28 0
Q 0 -28 28 0
Q 0 28 -28 0Z"
fill="none"
stroke="white"
stroke-width="5"/>

<circle r="9"
fill="white"/>

</g>

</g>


<!-- CV label -->

<g>

<text x="400" y="680"
text-anchor="middle"
