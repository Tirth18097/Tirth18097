<circle r="58"
fill="url(#mlPlanet)"
filter="url(#glow)"/>

<!-- gear -->
<circle r="18"
fill="none"
stroke="white"
stroke-width="8"/>

<circle r="6"
fill="white"/>

</g>

</g>


<!-- ML label -->

<g>

<text x="900" y="270"
fill="#ffb6f0"
font-family="Arial, sans-serif"
font-size="20"
font-weight="700">

Machine Learning

</text>

<rect x="945" y="285"
width="80"
height="38"
rx="19"
fill="#310b31"
stroke="#ff65d5"
stroke-width="2"/>

<text x="985" y="311"
text-anchor="middle"
fill="white"
font-family="Arial, sans-serif"
font-size="19"
font-weight="700">

90%

</text>

